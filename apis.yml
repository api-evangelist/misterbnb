name: MisterBnB
description: >-
  misterb&b (operated by SFO84 inc.) is the world's largest LGBTQ-focused travel
  and accommodation booking platform, connecting gay and queer travelers with
  LGBTQ-friendly rentable lodging including private rooms, apartments, hotels,
  and homestays across more than 200,000 cities worldwide. Founded in Paris in
  2014 by Matthieu Jost, François de Landes, Marc Dedonder, and Julien Delon and
  now headquartered in San Francisco, the company was surfaced as a portfolio
  company of 500 Global. Enrichment found no public developer/API surface: the
  consumer site is Cloudflare-protected (403 to non-browser clients), the
  github.com/misterbnb organization holds only open-source Ruby/JS forks, and no
  well-known, OpenAPI, SDK, or MCP artifacts are published. Host-partner
  connectivity is offered indirectly via channel managers such as Guesty rather
  than a documented public API.
